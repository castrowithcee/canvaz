name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      # Die Repository-Integrationstests laufen gegen eine echte PostgreSQL-Instanz, nicht gegen Attrappen.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: canvaz
          POSTGRES_PASSWORD: canvaz
          POSTGRES_DB: canvaz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=canvaz --dbname=canvaz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate repository baseline
        run: |
          test -f .github/dependabot.yml
          test -f SECURITY.md

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Require a lockfile
        if: ${{ hashFiles('package.json') != '' }}
        run: test -f package-lock.json

      - name: Install dependencies
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        run: npm ci

      - name: Audit dependencies
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        run: npm audit --audit-level=high

      - name: Lint
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        run: npm run lint --if-present

      - name: Typecheck
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        run: npm run typecheck --if-present

      - name: Test
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        env:
          CANVAZ_TEST_DATABASE_URL: postgres://canvaz:canvaz@127.0.0.1:5432/canvaz_test
        run: npm run test --if-present

      - name: Build
        if: ${{ hashFiles('package.json', 'package-lock.json') != '' }}
        run: npm run build --if-present

      # Die Browserpruefungen fahren die echte Anwendung samt Test-Provider hoch. Nur Chromium: eine Engine
      # deckt die geprueften Zusagen ab und haelt die Laufzeit vertretbar.
      - name: Install Playwright browser
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        if: ${{ hashFiles('playwright.config.ts') != '' }}
        env:
          CANVAZ_TEST_DATABASE_URL: postgres://canvaz:canvaz@127.0.0.1:5432/canvaz_test
        run: npx playwright test
