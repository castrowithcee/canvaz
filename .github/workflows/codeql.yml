name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build_mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect JavaScript or TypeScript source
        id: detect-source
        shell: bash
        run: |
          if find . -type f \
            \( -name '*.js' -o -name '*.jsx' -o -name '*.mjs' -o -name '*.cjs' \
            -o -name '*.ts' -o -name '*.tsx' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Skip CodeQL without source
        if: ${{ steps.detect-source.outputs.present != 'true' }}
        run: echo 'No JavaScript or TypeScript source yet; CodeQL activates with the first source file.'

      - name: Initialize CodeQL
        if: ${{ steps.detect-source.outputs.present == 'true' }}
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Analyze
        if: ${{ steps.detect-source.outputs.present == 'true' }}
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
