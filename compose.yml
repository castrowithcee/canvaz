# Lokale Entwicklungsdienste: PostgreSQL und MinIO.
#
# Hohe Hostports statt der Standardports: auf Entwicklungsmaschinen laufen haeufig andere Dienste, und die
# niedrigen Ports 8080, 8088, 8443 und 2022 sind auf dem Referenzhost bereits belegt.
# Die Zugangsdaten hier sind lokale Entwicklungswerte und keine Secrets; beide Instanzen lauschen nur auf
# 127.0.0.1 und sind von aussen nicht erreichbar.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvaz
      POSTGRES_PASSWORD: canvaz
      POSTGRES_DB: canvaz
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - canvaz-postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=canvaz --dbname=canvaz']
      interval: 2s
      timeout: 3s
      retries: 30

  # MinIO als S3-kompatibler Objektspeicher. Er ist der Gegenpart des `s3`-Storage-Adapters und macht ihn
  # lokal real pruefbar - die gemeinsame Contract-Testsuite laeuft unveraendert gegen ihn.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: canvaz
      MINIO_ROOT_PASSWORD: canvaz-minio-dev
    ports:
      - '127.0.0.1:59000:9000'
    volumes:
      - canvaz-minio-data:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  canvaz-postgres-data:
  canvaz-minio-data:
