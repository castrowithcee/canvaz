# Lokale Entwicklungs- und Testdatenbank.
#
# Hostport 55432 statt 5432: auf Entwicklungsmaschinen laufen haeufig andere Dienste, und die niedrigen
# Ports 8080, 8088, 8443 und 2022 sind auf dem Referenzhost bereits belegt.
# Die Zugangsdaten hier sind lokale Entwicklungswerte und keine Secrets; die Instanz lauscht nur auf 127.0.0.1.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: canvaz
      POSTGRES_PASSWORD: canvaz
      POSTGRES_DB: canvaz
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - canvaz-postgres-data:/var/lib/postgresql
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready --username=canvaz --dbname=canvaz']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  canvaz-postgres-data:
